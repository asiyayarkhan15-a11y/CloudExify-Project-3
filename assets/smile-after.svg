<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Stylised illustration of the same smile after treatment: even, bright teeth">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151A21"/>
      <stop offset="1" stop-color="#0A0C0F"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="46%" r="52%">
      <stop offset="0" stop-color="#D4AF37" stop-opacity=".2"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="toothA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#EFEDE6"/>
      <stop offset=".4"  stop-color="#FBFAF6"/>
      <stop offset="1"   stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="glossA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mouthA">
      <path d="M170 400 Q600 290 1030 400 Q600 610 170 400 Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="800" fill="url(#bgA)"/>
  <rect width="1200" height="800" fill="url(#glowA)"/>

  <g clip-path="url(#mouthA)">
    <!-- mouth interior -->
    <rect x="150" y="270" width="900" height="360" fill="#200E12"/>

    <!-- healthy, re-contoured gum line -->
    <path d="M170 400 Q600 290 1030 400 L1030 434 Q600 324 170 434 Z" fill="#A85F68"/>

    <!-- upper arch: even spacing, symmetrical arch, matched edges -->
    <g fill="url(#toothA)">
      <rect x="213" y="360" width="72" height="69"  rx="11"/>
      <rect x="291" y="360" width="72" height="97"  rx="11"/>
      <rect x="369" y="360" width="72" height="118" rx="11"/>
      <rect x="447" y="360" width="72" height="132" rx="11"/>
      <rect x="525" y="360" width="72" height="139" rx="11"/>
      <rect x="603" y="360" width="72" height="139" rx="11"/>
      <rect x="681" y="360" width="72" height="132" rx="11"/>
      <rect x="759" y="360" width="72" height="118" rx="11"/>
      <rect x="837" y="360" width="72" height="97"  rx="11"/>
      <rect x="915" y="360" width="72" height="69"  rx="11"/>
    </g>

    <!-- specular highlight band across the porcelain -->
    <g fill="url(#glossA)" opacity=".5">
      <rect x="228" y="372" width="42" height="34" rx="8"/>
      <rect x="306" y="372" width="42" height="46" rx="8"/>
      <rect x="384" y="372" width="42" height="58" rx="8"/>
      <rect x="462" y="372" width="42" height="66" rx="8"/>
      <rect x="540" y="372" width="42" height="72" rx="8"/>
      <rect x="618" y="372" width="42" height="72" rx="8"/>
      <rect x="696" y="372" width="42" height="66" rx="8"/>
      <rect x="774" y="372" width="42" height="58" rx="8"/>
      <rect x="852" y="372" width="42" height="46" rx="8"/>
      <rect x="930" y="372" width="42" height="34" rx="8"/>
    </g>

    <!-- lower arch, aligned -->
    <g fill="#F2F0EA" opacity=".92">
      <rect x="343" y="470" width="60" height="90" rx="9"/>
      <rect x="408" y="470" width="60" height="90" rx="9"/>
      <rect x="473" y="468" width="60" height="90" rx="9"/>
      <rect x="538" y="468" width="60" height="90" rx="9"/>
      <rect x="603" y="468" width="60" height="90" rx="9"/>
      <rect x="668" y="468" width="60" height="90" rx="9"/>
      <rect x="733" y="470" width="60" height="90" rx="9"/>
      <rect x="798" y="470" width="60" height="90" rx="9"/>
    </g>

    <!-- corner shadows -->
    <ellipse cx="200" cy="400" rx="70" ry="120" fill="#000" opacity=".5"/>
    <ellipse cx="1000" cy="400" rx="70" ry="120" fill="#000" opacity=".5"/>
  </g>

  <!-- lip outline -->
  <path d="M170 400 Q600 290 1030 400 Q600 610 170 400 Z" fill="none" stroke="#D4AF37" stroke-opacity=".45" stroke-width="2"/>
</svg>
