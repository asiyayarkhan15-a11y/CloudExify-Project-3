<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" aria-label="Clear aligner tray closing a gap between two front teeth">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A2029"/>
      <stop offset="1" stop-color="#0B0E12"/>
    </linearGradient>
    <radialGradient id="aglow" cx="50%" cy="34%" r="60%">
      <stop offset="0" stop-color="#D4AF37" stop-opacity=".2"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="atooth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDEAE1"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect width="600" height="440" fill="url(#abg)"/>
  <rect width="600" height="440" fill="url(#aglow)"/>

  <!-- arch of teeth with a closing midline gap -->
  <g fill="url(#atooth)">
    <rect x="96"  y="150" width="52" height="60"  rx="9"/>
    <rect x="156" y="146" width="52" height="76"  rx="9"/>
    <rect x="216" y="142" width="52" height="92"  rx="9"/>
    <rect x="276" y="138" width="46" height="108" rx="9"/>
    <rect x="330" y="138" width="46" height="108" rx="9"/>
    <rect x="384" y="142" width="52" height="92"  rx="9"/>
    <rect x="444" y="146" width="52" height="76"  rx="9"/>
    <rect x="504" y="150" width="52" height="60"  rx="9"/>
  </g>

  <!-- aligner tray outline hugging the arch -->
  <path d="M84 138 Q300 96 516 138 L516 232 Q300 300 84 232 Z"
        fill="none" stroke="#8FD6E8" stroke-opacity=".5" stroke-width="3" stroke-linejoin="round"/>
  <path d="M84 138 Q300 96 516 138 L516 232 Q300 300 84 232 Z"
        fill="#8FD6E8" fill-opacity=".07"/>

  <!-- gap measurement callout -->
  <line x1="322" y1="300" x2="322" y2="332" stroke="#D4AF37" stroke-opacity=".55" stroke-width="1"/>
  <line x1="330" y1="300" x2="330" y2="332" stroke="#D4AF37" stroke-opacity=".55" stroke-width="1"/>
  <line x1="290" y1="332" x2="362" y2="332" stroke="#D4AF37" stroke-opacity=".55" stroke-width="1"/>
  <text x="300" y="362" fill="#D4AF37" fill-opacity=".75" font-family="Jost, sans-serif" font-size="16" letter-spacing="2">4mm</text>
  <text x="386" y="362" fill="#8D9098" font-family="Jost, sans-serif" font-size="14" letter-spacing="2">&#8594; 0mm</text>
</svg>
