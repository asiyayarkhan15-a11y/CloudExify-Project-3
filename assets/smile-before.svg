<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Stylised illustration of a smile before treatment: uneven, discoloured teeth">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151A21"/>
      <stop offset="1" stop-color="#0A0C0F"/>
    </linearGradient>
    <radialGradient id="glowB" cx="50%" cy="46%" r="52%">
      <stop offset="0" stop-color="#D4AF37" stop-opacity=".14"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="toothB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#B7A473"/>
      <stop offset=".45" stop-color="#CDBB8C"/>
      <stop offset="1"   stop-color="#DCCFA8"/>
    </linearGradient>
    <linearGradient id="stainB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#6E5B2E" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#6E5B2E" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mouthB">
      <path d="M170 400 Q600 290 1030 400 Q600 610 170 400 Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="800" fill="url(#bgB)"/>
  <rect width="1200" height="800" fill="url(#glowB)"/>

  <g clip-path="url(#mouthB)">
    <!-- mouth interior -->
    <rect x="150" y="270" width="900" height="360" fill="#200E12"/>

    <!-- gum line, slightly inflamed tone -->
    <path d="M170 400 Q600 290 1030 400 L1030 438 Q600 328 170 438 Z" fill="#7C4048"/>

    <!-- upper arch: crowded, uneven, one worn edge, one diastema -->
    <g fill="url(#toothB)">
      <rect x="213" y="360" width="72" height="69"  rx="11"/>
      <rect x="291" y="360" width="72" height="97"  rx="11" transform="rotate(-3.5 327 457)"/>
      <rect x="369" y="360" width="72" height="100" rx="11"/>
      <rect x="447" y="360" width="72" height="132" rx="11"/>
      <rect x="518" y="360" width="72" height="139" rx="11"/>
      <rect x="612" y="360" width="72" height="139" rx="11"/>
      <rect x="688" y="360" width="72" height="132" rx="11" transform="rotate(4 724 492)"/>
      <rect x="759" y="360" width="72" height="118" rx="11"/>
      <rect x="837" y="360" width="72" height="97"  rx="11"/>
      <rect x="915" y="360" width="72" height="69"  rx="11"/>
    </g>

    <!-- staining that pools at the gum line -->
    <g fill="url(#stainB)">
      <rect x="213" y="360" width="72" height="69"  rx="11"/>
      <rect x="291" y="360" width="72" height="97"  rx="11"/>
      <rect x="369" y="360" width="72" height="100" rx="11"/>
      <rect x="447" y="360" width="72" height="132" rx="11"/>
      <rect x="518" y="360" width="72" height="139" rx="11"/>
      <rect x="612" y="360" width="72" height="139" rx="11"/>
      <rect x="688" y="360" width="72" height="132" rx="11"/>
      <rect x="759" y="360" width="72" height="118" rx="11"/>
      <rect x="837" y="360" width="72" height="97"  rx="11"/>
      <rect x="915" y="360" width="72" height="69"  rx="11"/>
    </g>

    <!-- lower arch -->
    <g fill="#B4A170" opacity=".9">
      <rect x="343" y="470" width="60" height="90" rx="9" transform="rotate(-4 373 515)"/>
      <rect x="408" y="472" width="60" height="90" rx="9"/>
      <rect x="473" y="468" width="60" height="90" rx="9"/>
      <rect x="538" y="470" width="60" height="90" rx="9" transform="rotate(3 568 515)"/>
      <rect x="603" y="468" width="60" height="90" rx="9"/>
      <rect x="668" y="472" width="60" height="90" rx="9"/>
      <rect x="733" y="470" width="60" height="90" rx="9"/>
      <rect x="798" y="474" width="60" height="90" rx="9"/>
    </g>

    <!-- corner shadows -->
    <ellipse cx="200" cy="400" rx="70" ry="120" fill="#000" opacity=".55"/>
    <ellipse cx="1000" cy="400" rx="70" ry="120" fill="#000" opacity=".55"/>
  </g>

  <!-- lip outline -->
  <path d="M170 400 Q600 290 1030 400 Q600 610 170 400 Z" fill="none" stroke="#D4AF37" stroke-opacity=".28" stroke-width="2"/>
</svg>
